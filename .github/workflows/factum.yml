name: factum-heartbeat

on:
  schedule:
    - cron: "17 */6 * * *"   # сердцебиение каждые 6 часов
  workflow_dispatch: {}      # ручной удар (и дефибрилляция от пульса, правило 26)

permissions:
  contents: write            # минимум прав: RECORD = коммит сот (§1.2 secure-use)

concurrency:
  group: factum-heartbeat
  cancel-in-progress: false  # удары не сбивают друг друга

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # химия (150k шагов) не должна становиться зомби
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: удар сердца (SKI + BCI + CHEM)
        run: python3 factum.py --heartbeat
      - name: целость сот (иммунитет)
        run: python3 factum.py --verify
      - name: записать факт (RECORD · правило 4: push → при отказе rebase до 3 попыток)
        run: |
          git config user.name "factum[bot]"
          git config user.email "factum[bot]@users.noreply.github.com"
          git add JOURNAL.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "factum: heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ) · REVE=РЕВО"
            ok=""
            for i in 1 2 3; do
              if git push origin HEAD:main; then ok=1; break; fi
              git fetch origin main
              git pull --rebase=merges origin main || git pull --rebase origin main
            done
            [ -n "$ok" ] || { echo "push не прошёл за 3 попытки (правило 4)"; exit 1; }
          fi
